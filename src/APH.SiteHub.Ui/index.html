<!doctype html>
<html lang="en" data-theme="sitehub-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Website directory and provider account management" />
    <title>APH SiteHub</title>
    <script>
      // Applies the stored theme before first paint so there is no flash of the wrong theme.
      // Keep in sync with applyMode in src/lib/theme.ts.
      (()=> {try{let m=localStorage.getItem('sitehub-theme');if(m!=='light'&&m!=='dark')m='system';const d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);const e=document.documentElement;e.dataset.theme=d?'sitehub-dark':'sitehub-light';e.classList.toggle('dark',d);e.classList.toggle('light',!d);e.style.colorScheme=d?'dark':'light'}catch(_){}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
