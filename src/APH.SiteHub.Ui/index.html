<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Website directory and provider account management" />
    <title>APH SiteHub</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      // Applies the stored theme before first paint so there is no flash of the wrong theme.
      // Keep in sync with applyMode in src/lib/theme.js.
      (()=> {try{let m=localStorage.getItem('sitehub-theme');if(m!=='light'&&m!=='dark')m='system';const d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);const e=document.documentElement;e.dataset.theme=d?'dark':'light';e.style.colorScheme=d?'dark':'light'}catch(_){}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
