<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Website directory and provider account management" />
    <title>APH SiteHub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230d6a57%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E" />
    <script>
      // Applies the stored theme before first paint so there is no flash of the wrong theme.
      // Keep in sync with applyMode in src/lib/theme.js.
      (()=> {try{let m=localStorage.getItem('sitehub-theme');if(m!=='light'&&m!=='dark')m='system';const d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);const e=document.documentElement;e.dataset.theme=d?'dark':'light';e.style.colorScheme=d?'dark':'light'}catch(_){}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
