services:
  oracle:
    # Official Oracle Database Free image (23ai, "lite" variant) from Oracle Container Registry.
    image: container-registry.oracle.com/database/free:latest-lite
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      ORACLE_APP_USER: ${ORACLE_APP_USER:-sitehub}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/init:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ['CMD-SHELL', '/opt/oracle/checkDBStatus.sh >/dev/null || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: src/APH.SiteHub.Api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      API_PORT: 3000
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: src/APH.SiteHub.Ui/Dockerfile
    ports:
      - '8111:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /health is proxied by the Next.js rewrite to the backend's database-backed probe.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  oracle_data:
