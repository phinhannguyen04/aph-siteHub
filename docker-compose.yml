services:
  oracle:
    # Official Oracle Database Free image (23ai, "lite" variant) from Oracle Container Registry.
    image: container-registry.oracle.com/database/free:latest-lite
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      ORACLE_APP_USER: ${ORACLE_APP_USER:-sitehub}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:?Set ORACLE_APP_PASSWORD in .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/oracle/init:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ['CMD-SHELL', '/opt/oracle/checkDBStatus.sh >/dev/null || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: src/APH.SiteHub.Api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      API_PORT: 3000
      ASPNETCORE_ENVIRONMENT: Production
      # Ship logs/traces/metrics to the dashboard service below (see ServiceDefaults).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_SERVICE_NAME: sitehub-api
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: src/APH.SiteHub.Ui/Dockerfile
    ports:
      - '8111:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /health is proxied by nginx to the backend's database-backed probe.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    # Standalone Aspire Dashboard: logs, traces and metrics sent by the backend over OTLP.
    # The Resources page needs the AppHost (bun run aspire) and is not available here.
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - '15180:18888'
    environment:
      # No login: anyone who can reach port 15180 sees logs and traces. Trusted LAN only.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'true'
      # The OTLP port (18889) is not published: only services on the Compose network reach it.
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    restart: unless-stopped

volumes:
  oracle_data:
