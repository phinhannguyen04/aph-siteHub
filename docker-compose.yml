services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sitehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: src/APH.SiteHub.Api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      API_PORT: 3000
      ASPNETCORE_ENVIRONMENT: Production
      # Ship logs/traces/metrics to the dashboard service below (see ServiceDefaults).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_SERVICE_NAME: sitehub-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: src/APH.SiteHub.Ui/Dockerfile
    ports:
      - '8111:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /health is proxied by nginx to the backend's database-backed probe.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    # Standalone Aspire Dashboard: logs, traces and metrics sent by the backend over OTLP.
    # The Resources page needs the AppHost (npm run aspire) and is not available here.
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - '15180:18888'
    environment:
      # No login: anyone who can reach port 15180 sees logs and traces. Trusted LAN only.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'true'
      # The OTLP port (18889) is not published: only services on the Compose network reach it.
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    restart: unless-stopped

volumes:
  postgres_data:
