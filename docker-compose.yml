services:
  surrealdb:
    image: surrealdb/surrealdb:v3.3.0
    command: ['start', 'rocksdb:/home/nonroot/sitehub.db']
    environment:
      SURREAL_USER: ${SURREAL_USER:?Set SURREAL_USER in .env}
      SURREAL_PASS: ${SURREAL_PASS:?Set SURREAL_PASS in .env}
    volumes:
      - surreal_data:/home/nonroot
    healthcheck:
      test: ['CMD', '/surreal', 'is-ready', '-e', 'http://127.0.0.1:8000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const response = await fetch('http://127.0.0.1:3000/health'); if (!response.ok) process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8111:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  surreal_data:
